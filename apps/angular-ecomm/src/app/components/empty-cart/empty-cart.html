<div class="flex flex-col items-center py-20">
  <div class="text-7xl">🛒</div>
  <h2 class="mt-6 text-2xl font-bold">Your cart is empty</h2>
  <p class="mt-2 text-gray-500">Looks like you haven't added anything yet.</p>
  @if (this.auth.user()) {
    <button class="mt-8 rounded-lg bg-blue-600 px-8 py-3 text-white hover:bg-blue-700">
      Continue Shopping
    </button>
  } @else {
    <app-login-button></app-login-button>
  }
</div>
