<div
  class="group cursor-pointer rounded-lg border border-gray-200 bg-white p-4 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg"
  (click)="onCardClick()"
>
  <!-- Image -->
  <div class="flex h-52 items-center justify-center overflow-hidden">
    <img
      [src]="product().image"
      [alt]="product().name"
      class="max-h-full max-w-full object-contain transition-transform duration-300 group-hover:scale-105"
    />
  </div>

  <!-- Product Info -->
  <div class="mt-4 space-y-2">
    <h3 class="line-clamp-2 text-sm font-medium text-gray-800">
      {{ product().name }}
    </h3>

    <p class="line-clamp-2 text-xs text-gray-500">
      {{ product().description }}
    </p>

    <!-- Rating -->
    <div class="flex items-center gap-2">
      <span class="rounded bg-green-600 px-2 py-0.5 text-xs font-semibold text-white"> ★ 4.5 </span>

      <span class="text-xs text-gray-500"> (2,341) </span>
    </div>

    <!-- Price -->
    <div class="flex items-center gap-2">
      <span class="text-lg font-semibold text-gray-900"> ₹{{ product().price }} </span>

      <span class="text-sm text-gray-400 line-through"> ₹{{ product().price + 500 }} </span>

      <span class="text-sm font-medium text-green-600"> 20% off </span>
    </div>

    <!-- Delivery -->
    <p class="text-xs text-green-700">Free Delivery</p>
  </div>
</div>
