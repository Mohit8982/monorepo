<div class="flex flex-col gap-4 rounded-xl border bg-white p-4 shadow-sm sm:flex-row m-2">
  <!-- Image -->
  <div class="h-28 w-28 shrink-0 overflow-hidden rounded-lg bg-gray-100">
    <img [src]="item.image" [alt]="item.title" class="h-full w-full object-cover" />
  </div>

  <div class="flex flex-1 flex-col">
    <h3 class="text-lg font-semibold">
      {{ item.title }}
    </h3>

    <p class="mt-1 text-sm text-gray-500">
      {{ item.category }}
    </p>

    <div class="mt-3 flex items-center gap-2">
      <span class="text-2xl font-bold"> ${{ item.price }} </span>
    </div>

    <!-- Bottom -->
    <div class="mt-4 flex flex-wrap items-center justify-between gap-4">
      <!-- Quantity -->
      <div class="flex items-center rounded-lg border">
        <button class="px-3 py-2 hover:bg-gray-100">-</button>

        <span class="px-4">
          {{ item.quantity }}
        </span>

        <button class="px-3 py-2 hover:bg-gray-100">+</button>
      </div>

      <!-- Subtotal -->
      <span class="font-semibold"> ${{ item.subtotal }} </span>

      <!-- Actions -->
      <button class="text-red-600 hover:text-red-700">Remove</button>
    </div>
  </div>
</div>
