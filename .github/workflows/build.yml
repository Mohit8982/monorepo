  ################################################################################
  # DEPLOY ANGULAR
  ################################################################################

  deploy-angular:
    name: Deploy Angular
    needs: [detect-changes, angular]

    if: |
      needs.detect-changes.outputs.frontend_ang == 'true' ||
      needs.detect-changes.outputs.shared == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ANGULAR_FRONTEND_TASK_DEFINITION }} \
            --query taskDefinition \
            > task-definition.json

      - run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition.json > cleaned.json

          mv cleaned.json task-definition.json

      - id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ secrets.ANGULAR_FRONTEND_CONTAINER_NAME }}
          image: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_FRONTEND_REPO_ANG }}:${{ github.sha }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          service: ${{ secrets.ANGULAR_FRONTEND_SERVICE }}
